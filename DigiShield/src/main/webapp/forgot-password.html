<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DigiShield - Reset Access</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #070b19;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            border: 2px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            padding: 30px;
            width: 320px;
            background: #0b112c;
            text-align: center;
        }
        h2 {
            margin: 0;
            color: #ffffff;
            font-size: 24px;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: #00d2ff;
            font-size: 12px;
            margin-top: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            font-size: 12px;
            color: #a0aec0;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 92%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #00d2ff;
            background: #152244;
            color: white;
            outline: none;
        }
        button {
            width: 100%;
            padding: 11px;
            background: #00d2ff;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }
        button:hover {
            background: #00b8e6;
        }
        .back-link {
            color: #00d2ff;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>DIGISHIELD</h2>
        <p class="subtitle">RESET CYBER NODE ACCESS</p>
        
        <form action="ResetPasswordServlet" method="POST">
            <div class="input-group">
                <label>Username / Security ID</label>
                <input type="text" name="username" placeholder="Enter Username" required>
            </div>
            
            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="newPassword" placeholder="Enter New Password" required>
            </div>
            
            <button type="submit">UPDATE PASSWORD</button>
        </form>

        <a href="index.html" class="back-link">← Back to Login</a>
    </div>

</body>
</html>
