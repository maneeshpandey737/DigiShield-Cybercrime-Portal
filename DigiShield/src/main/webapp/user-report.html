<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiShield - File a Report</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .form-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; margin-top: 0; text-align: center; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea { resize: vertical; height: 100px; }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:hover { background-color: #c0392b; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h2>DigiShield 🛡️ Cyber Crime Reporting</h2>
    </header>

    <div class="form-container">
        <h2>File an Incident Report</h2>
        <form action="SubmitComplaintServlet" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Full Name (Optional):</label>
                <input type="text" id="name" placeholder="Enter your name or leave blank for anonymity" name="username">
            </div>

            <div class="form-group">
                <label for="email">Email Address / Contact Info:</label>
                <input type="email" id="email" required placeholder="Enter email to receive status updates">
            </div>

            <div class="form-group">
                <label for="category">Select Category:</label>
                <select id="category" required>
                    <option value="">-- Choose Category --</option>
                    <option value="Kids">Kids Protection (Cyberbullying/Gaming Fraud)</option>
                    <option value="Women">Women Safety (Harassment/Stalking)</option>
                    <option value="Elders">Elders Support (UPI/OTP Financial Scam)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details">Incident Details:</label>
                <textarea id="details" name="complaint_text" required placeholder="Describe what happened in detail..."></textarea>
            </div>
            <div class="form-group">
    <label for="evidence">Attach Evidence (Screenshot / PDF / Image):</label>
    <input type="file" id="evidence" name="evidence" accept="image/*,.pdf">
</div>

            <button type="submit" class="submit-btn">Submit Secure Report</button>
        </form>

        <a href="portal.html" class="back-link">← Go Back to Home</a>
    </div>

</body>
</html>
